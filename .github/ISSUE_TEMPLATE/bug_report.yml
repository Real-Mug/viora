name: Bug report
description: Something on the site is broken or wrong.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: https://viorarental.com/services
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where did you see it
      options:
        - Production (viorarental.com)
        - GitHub Pages preview
        - Local dev (npm run dev)
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Browser and device
      placeholder: Chrome 140 on iPhone 15, Safari on macOS, ...

  - type: textarea
    id: extra
    attributes:
      label: Screenshots or console output
