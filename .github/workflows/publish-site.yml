# Builds the static export and publishes it straight to GitHub Pages from this
# repository.
#
# This used to build here and force-push the result into a second public repo,
# Real-Mug/viora-site, because Pages will not serve from a private repository on
# the free plan and this repo was private. It is public now, so the second repo,
# its ed25519 deploy key and the SITE_DEPLOY_KEY secret are all redundant:
# source and site live together and Pages deploys the artefact directly.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

# pages and id-token are what actions/deploy-pages needs in order to publish.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue rather than cancel, so a build that has
# already been handed to Pages is not thrown away halfway through publishing.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # A Pages project site is served from /<repo>/, so the export must be built
  # with that prefix. The repo serving Pages is this one, so it is /viora.
  NEXT_PUBLIC_BASE_PATH: /viora
  NEXT_PUBLIC_SITE_URL: https://real-mug.github.io/viora
  NEXT_PUBLIC_CONTENT_MODE: placeholder
  DEPLOY_TARGET: static

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static export
        run: npm run build

      - name: Audit the export
        run: npm run audit:site

      # .nojekyll ships in public/ and is required: Jekyll would otherwise strip
      # the /_next directory and the site would load unstyled.
      - name: Guarantee .nojekyll
        run: test -f out/.nojekyll || touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
